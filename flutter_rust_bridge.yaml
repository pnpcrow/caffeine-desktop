# flutter_rust_bridge v2 codegen config (standard layout:
# Flutter project at repo root, Rust crate in rust/).
# Rust crate version (rust/) and the Dart package version must share
# the same major.minor (2.13) or codegen refuses to run.
rust_input: crate::api
dart_output: lib/src/rust
rust_root: rust
add_mod_to_lib: false
