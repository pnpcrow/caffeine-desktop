[package]
name = "caffeine-core"
version = "0.3.0"
edition = "2021"

[lib]
name = "caffeine_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match flutter_rust_bridge_codegen major.minor (2.13).
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
